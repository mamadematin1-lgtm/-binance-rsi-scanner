<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Futures RSI Screener</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px;background:#f5f5f7;color:#111}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:white;font-size:17px}
#status{margin-top:12px;color:#666;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #eee}
th{font-weight:700}
.green{color:#087f23;font-weight:700}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>Binance Futures RSI Scanner</h2>
<p class="small">1H · RSI(14) · current RSI &gt; 50 · RSI was below 30 within the last 48 closed candles · volume ≥ 5M USDT</p>
<button id="scan">🔍 Scan Binance Futures</button>
<div id="status">Ready.</div>
</div>
<div class="card" id="results" style="display:none">
<table>
<thead><tr><th>#</th><th>Symbol</th><th>RSI</th><th>Bars</th><th>24h Vol</th></tr></thead>
<tbody id="body"></tbody>
</table>
</div>
<script>
const BASE="https://fapi.binance.com";
const LOOKBACK=48, PERIOD=14, MINVOL=5000000;

function rsi(vals,p=14){
 let gain=0,loss=0,out=new Array(vals.length).fill(null);
 for(let i=1;i<=p;i++){let d=vals[i]-vals[i-1];gain+=Math.max(d,0);loss+=Math.max(-d,0)}
 gain/=p;loss/=p;
 out[p]=loss===0?100:100-100/(1+gain/loss);
 for(let i=p+1;i<vals.length;i++){
   let d=vals[i]-vals[i-1];
   gain=(gain*(p-1)+Math.max(d,0))/p;
   loss=(loss*(p-1)+Math.max(-d,0))/p;
   out[i]=loss===0?100:100-100/(1+gain/loss);
 }
 return out;
}
function fmt(n){return n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":(n/1e3).toFixed(0)+"K"}

async function getJSON(url){
 const r=await fetch(url);
 if(!r.ok) throw new Error("HTTP "+r.status);
 return r.json();
}

async function scan(){
 const status=document.getElementById("status");
 const btn=document.getElementById("scan");
 btn.disabled=true;
 document.getElementById("results").style.display="none";
 try{
   status.textContent="1/3 Getting active USDT perpetuals...";
   const info=await getJSON(BASE+"/fapi/v1/exchangeInfo");
   const symbols=info.symbols.filter(s=>s.status==="TRADING"&&s.contractType==="PERPETUAL"&&s.quoteAsset==="USDT").map(s=>s.symbol);

   status.textContent=`2/3 Getting 24h volume...\n${symbols.length} contracts found.`;
   const tick=await getJSON(BASE+"/fapi/v1/ticker/24hr");
   const vol={}; tick.forEach(x=>vol[x.symbol]=Number(x.quoteVolume));
   const liquid=symbols.filter(s=>(vol[s]||0)>=MINVOL);

   status.textContent=`3/3 Scanning 1H candles...\n${liquid.length} liquid contracts. Please wait...`;
   const results=[];
   const concurrency=8;
   let next=0,done=0;
   async function worker(){
     while(true){
       const i=next++; if(i>=liquid.length) return;
       const sym=liquid[i];
       try{
         const rows=await getJSON(`${BASE}/fapi/v1/klines?symbol=${sym}&interval=1h&limit=100`);
         rows.pop(); // ignore current open candle
         const closes=rows.map(x=>Number(x[4]));
         const rr=rsi(closes,PERIOD);
         const cur=rr[rr.length-1];
         if(cur>50){
           const start=Math.max(PERIOD,rr.length-LOOKBACK-1);
           let last=-1;
           for(let j=start;j<rr.length-1;j++) if(rr[j]<30) last=j;
           if(last>=0){
             let crossed=false;
             for(let j=last+1;j<rr.length-1;j++){
               if(rr[j-1]<=30 && rr[j]>30){crossed=true;break}
             }
             if(crossed) results.push({symbol:sym,rsi:cur,bars:rr.length-1-last,vol:vol[sym]});
           }
         }
       }catch(e){}
       done++;
       if(done%10===0||done===liquid.length) status.textContent=`3/3 Scanning 1H candles...\n${done}/${liquid.length}`;
     }
   }
   await Promise.all(Array.from({length:concurrency},worker));
   results.sort((a,b)=>b.rsi-a.rsi);
   const body=document.getElementById("body"); body.innerHTML="";
   results.forEach((x,i)=>{
     body.innerHTML+=`<tr><td>${i+1}</td><td><b>${x.symbol}</b></td><td class="green">${x.rsi.toFixed(2)}</td><td>${x.bars}</td><td>${fmt(x.vol)}</td></tr>`;
   });
   document.getElementById("results").style.display="block";
   status.textContent=`Done.\n${results.length} matching setups found.`;
 }catch(e){status.textContent="Error: "+e.message+"\nIf Binance is blocked on your network, try another connection."}
 finally{btn.disabled=false}
}
document.getElementById("scan").onclick=scan;
</script>
</body>
</html>
